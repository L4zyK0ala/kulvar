name: Tests

# Unit and smoke tests on every push and pull request. No external services are called:
# Claude, Telegram, Garmin and Hevy are replaced by fakes, and the database is a temporary SQLite file.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-dev.txt

      # --no-deps: versions are pinned in the lock file; myfitnesspal's old strict pins would otherwise break the resolver.
      - name: Install dependencies
        run: pip install --no-deps -r requirements.lock -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest
